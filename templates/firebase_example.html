{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Login Example - K-DATA HUB</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <style>
        .firebase-auth-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .firebase-form {
            display: flex;
            flex-direction: column;
        }
        
        .firebase-form h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0,123,255,0.5);
        }
        
        .submit-btn {
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        
        .submit-btn:hover {
            background-color: #0056b3;
        }
        
        .error-message {
            color: #d32f2f;
            padding: 10px;
            margin-bottom: 15px;
            background-color: #ffebee;
            border-radius: 4px;
            display: none;
        }
        
        .success-message {
            color: #388e3c;
            padding: 10px;
            margin-bottom: 15px;
            background-color: #e8f5e9;
            border-radius: 4px;
            display: none;
        }
        
        .form-toggle {
            text-align: center;
            margin-top: 15px;
        }
        
        .form-toggle a {
            color: #007bff;
            cursor: pointer;
            text-decoration: none;
        }
        
        .form-toggle a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="firebase-auth-container">
        <!-- Login Form -->
        <form id="firebase-login-form" class="firebase-form">
            <h2>Firebase Login</h2>
            
            <div class="error-message" id="firebase-login-error"></div>
            
            <div class="form-group">
                <label for="firebase-email">Email</label>
                <input 
                    type="email" 
                    id="firebase-email" 
                    name="email" 
                    required
                    placeholder="you@example.com"
                >
            </div>
            
            <div class="form-group">
                <label for="firebase-password">Password</label>
                <input 
                    type="password" 
                    id="firebase-password" 
                    name="password" 
                    required
                    placeholder="Enter your password"
                >
            </div>
            
            <button type="submit" class="submit-btn">Login with Firebase</button>
            
            <div class="form-toggle">
                Don't have an account? <a href="#" onclick="toggleForms()">Sign up here</a>
            </div>
        </form>

        <!-- Sign Up Form (Hidden by default) -->
        <form id="firebase-signup-form" class="firebase-form" style="display: none;">
            <h2>Firebase Sign Up</h2>
            
            <div class="error-message" id="firebase-signup-error"></div>
            <div class="success-message" id="firebase-signup-success"></div>
            
            <div class="form-group">
                <label for="firebase-username">Username</label>
                <input 
                    type="text" 
                    id="firebase-username" 
                    name="username" 
                    required
                    placeholder="Choose a username"
                >
            </div>
            
            <div class="form-group">
                <label for="firebase-signup-email">Email</label>
                <input 
                    type="email" 
                    id="firebase-signup-email" 
                    name="email" 
                    required
                    placeholder="you@example.com"
                >
            </div>
            
            <div class="form-group">
                <label for="firebase-signup-password">Password</label>
                <input 
                    type="password" 
                    id="firebase-signup-password" 
                    name="password" 
                    required
                    placeholder="At least 8 characters"
                >
            </div>
            
            <div class="form-group">
                <label for="firebase-confirm-password">Confirm Password</label>
                <input 
                    type="password" 
                    id="firebase-confirm-password" 
                    name="confirm_password" 
                    required
                    placeholder="Confirm your password"
                >
            </div>
            
            <button type="submit" class="submit-btn">Sign Up with Firebase</button>
            
            <div class="form-toggle">
                Already have an account? <a href="#" onclick="toggleForms()">Login here</a>
            </div>
        </form>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js"></script>
    
    <!-- Firebase Configuration -->
    <script src="{% static 'js/firebase-config.js' %}"></script>
    
    <!-- Firebase Authentication -->
    <script src="{% static 'js/firebase-auth.js' %}"></script>
    
    <!-- Firebase Forms Handler -->
    <script src="{% static 'js/firebase-forms.js' %}"></script>
    
    <!-- Additional form toggle script -->
    <script>
        function toggleForms() {
            const loginForm = document.getElementById('firebase-login-form');
            const signupForm = document.getElementById('firebase-signup-form');
            
            loginForm.style.display = loginForm.style.display === 'none' ? 'flex' : 'none';
            signupForm.style.display = signupForm.style.display === 'none' ? 'flex' : 'none';
        }
        
        // Update form IDs to match HTML
        document.addEventListener('DOMContentLoaded', () => {
            const emailInput = document.getElementById('firebase-signup-email');
            const passwordInput = document.getElementById('firebase-signup-password');
            const confirmInput = document.getElementById('firebase-confirm-password');
            
            if (emailInput) {
                emailInput.id = 'firebase-email';
            }
            if (passwordInput) {
                passwordInput.id = 'firebase-password';
            }
        });
    </script>
</body>
</html>
