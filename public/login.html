<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - K-DATA HUB</title>
    <link rel="icon" type="image/png" href="static/img/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/css/styles.css">
    <link rel="stylesheet" href="static/css/js-effects.css">
    <style>
        .firebase-auth-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            background: white;
        }
        
        .firebase-form {
            display: flex;
            flex-direction: column;
        }
        
        .firebase-form h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0,123,255,0.5);
        }
        
        .submit-btn {
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        
        .submit-btn:hover {
            background-color: #0056b3;
        }
        
        .error-message {
            color: #d32f2f;
            padding: 10px;
            margin-bottom: 15px;
            background-color: #ffebee;
            border-radius: 4px;
            display: none;
        }
        
        .success-message {
            color: #388e3c;
            padding: 10px;
            margin-bottom: 15px;
            background-color: #e8f5e9;
            border-radius: 4px;
            display: none;
        }
        
        .form-toggle {
            text-align: center;
            margin-top: 15px;
        }
        
        .form-toggle a {
            color: #007bff;
            cursor: pointer;
            text-decoration: none;
        }
        
        .form-toggle a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <h2>K-DATA HUB</h2>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html" class="active">Login</a></li>
                <li><a href="signup.html">Sign Up</a></li>
                <li><a href="become-agent.html">Become Agent</a></li>
                <li><a href="support.html">Support</a></li>
            </ul>
        </div>
    </nav>

    <main style="min-height: 80vh; display: flex; align-items: center; justify-content: center; background: #f8fafc;">
        <div class="firebase-auth-container">
            <!-- Login Form -->
            <form id="firebase-login-form" class="firebase-form">
                <h2>Login to K-DATA HUB</h2>
                
                <div class="error-message" id="firebase-login-error"></div>
                
                <div class="form-group">
                    <label for="firebase-email">Email</label>
                    <input 
                        type="email" 
                        id="firebase-email" 
                        name="email" 
                        required
                        placeholder="you@example.com"
                    >
                </div>
                
                <div class="form-group">
                    <label for="firebase-password">Password</label>
                    <input 
                        type="password" 
                        id="firebase-password" 
                        name="password" 
                        required
                        placeholder="Enter your password"
                    >
                </div>
                
                <button type="submit" class="submit-btn">Login</button>
                
                <div class="form-toggle">
                    Don't have an account? <a href="signup.html">Sign up here</a>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <div class="footer-container">
            <p>&copy; 2026 K-DATA HUB. All rights reserved.</p>
            <div class="footer-links">
                <a href="support.html">Support</a>
                <a href="#">Privacy Policy</a>
                <a href="#">Terms of Service</a>
            </div>
        </div>
    </footer>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    
    <!-- Firebase Configuration -->
    <script src="static/js/firebase-config.js"></script>
    
    <!-- Firebase Authentication -->
    <script src="static/js/firebase-auth.js"></script>
    
    <!-- Firebase Forms Handler -->
    <script src="static/js/firebase-forms.js"></script>
</body>
</html>
